[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-rag"
version = "0.1.0"
description = "Agentic RAG over RBI circulars and bank lending policies, with citations and evals."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Reuben C Mathew" }]
dependencies = [
    # LLM
    "google-genai>=1.50",
    # Ingestion
    "langchain-text-splitters>=0.3",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    # Embeddings + vector store (CPU only)
    "sentence-transformers>=3.0",
    "qdrant-client>=1.12",
    # Utilities
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pandas>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Installed on Friday (week 1) when the eval harness goes in.
eval = ["ragas>=0.3", "langchain-google-genai>=2.0"]
# Week 2.
agent = ["langgraph>=1.0", "langsmith>=0.2", "rank-bm25>=0.2"]
dev = ["pytest>=8.0", "ruff>=0.6", "psutil>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
